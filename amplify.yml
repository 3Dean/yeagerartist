version: 1
backend:
  phases:
    build:
      commands:
        - cd amplify
        - npx @aws-amplify/backend-cli@latest push --simple --envName prod
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - amplify/node_modules/**/*
